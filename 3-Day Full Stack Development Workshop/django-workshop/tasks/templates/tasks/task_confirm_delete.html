{% extends "tasks/base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">

        <h1>Delete Task</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ task.title }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'home' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
