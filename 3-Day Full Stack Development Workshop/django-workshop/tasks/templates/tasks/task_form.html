{% extends "tasks/base.html" %}

{% block title %}Task Form{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">

        <h1 class="mb-4">
            {% if task %}Edit Task{% else %}Add Task{% endif %}
        </h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save Task
            </button>

            <a href="{% url 'home' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
